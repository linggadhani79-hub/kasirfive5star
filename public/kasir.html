<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3b2418">
  <title>Kasir</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .shell { display: grid; grid-template-columns: 88px minmax(0, 1fr); height: calc(100dvh - 64px); }
    .side { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; padding: 8px; overflow: auto; }
    .side button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; border-radius: 14px; border: 0; background: transparent; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--ink-2); position: relative; }
    .side button .i { font-size: 24px; }
    .side button.active { background: var(--gold-soft); color: var(--ink); }
    .side .dot { position: absolute; top: 4px; right: 10px; background: var(--bad); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 6px; }
    .view { min-height: 0; overflow: hidden; }
    .split { display: grid; grid-template-columns: minmax(300px, 420px) minmax(0, 1fr); height: 100%; }
    .pane { overflow: auto; padding: 14px; }
    .pane + .pane { border-left: 1px solid var(--line); background: var(--surface); }
    .olist { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .orow { display: flex; gap: 10px; align-items: center; padding: 12px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); cursor: pointer; text-align: left; width: 100%; }
    .orow.sel { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
    .orow .q { font-size: 20px; font-weight: 900; min-width: 64px; }
    .detail-actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .items-tbl td { padding: 8px 6px; }
    .pos { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: 100%; }
    .pos .menu { overflow: auto; padding: 14px; }
    .pos .cart { border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
    .pos .cart-items { flex: 1; overflow: auto; padding: 8px 14px; }
    .pos .cart-foot { padding: 12px 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
    .ci { display: flex; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--line); align-items: center; }
    .tot { display: flex; justify-content: space-between; font-size: 14px; }
    .tot.big { font-size: 22px; font-weight: 800; }
    .cash-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .methods { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
    .methods button.on { border-color: var(--gold); background: var(--gold-soft); }
    .page { padding: 16px; overflow: auto; height: 100%; }
    .waiter { position: fixed; top: 76px; right: 16px; z-index: 120; background: var(--gold); color: #2a1c14; padding: 14px 18px; border-radius: 16px; box-shadow: var(--shadow-lg); font-weight: 700; display: flex; gap: 12px; align-items: center; animation: pop .2s; }
    @media (max-width: 960px) {
      .split, .pos { grid-template-columns: 1fr; }
      .pane + .pane, .pos .cart { border-left: 0; border-top: 1px solid var(--line); }
      .view { overflow: auto; }
      .split, .pos { height: auto; }
    }
    @media (max-width: 640px) { .shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .side { flex-direction: row; border-right: 0; border-bottom: 1px solid var(--line); } .side button { flex: 1; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span id="logo"></span><div><span id="store">Five5Star Coffee</span><small id="who">Kasir</small></div></div>
    <div class="spacer"></div>
    <a class="btn hidden" id="btn-admin" href="/admin.html">📊 Superadmin</a>
    <button class="btn" id="btn-logout">Keluar</button>
    <span class="conn" id="conn"></span>
  </header>
  <div class="shell">
    <nav class="side" id="side">
      <button data-view="orders" class="active"><span class="i">🧾</span>Pesanan<span class="dot hidden" id="dot-orders"></span></button>
      <button data-view="pos"><span class="i">➕</span>Order Baru</button>
      <button data-view="stock"><span class="i">📦</span>Stok<span class="dot hidden" id="dot-stock"></span></button>
      <button data-view="cash"><span class="i">💵</span>Kas</button>
      <button data-view="report"><span class="i">📈</span>Hari Ini</button>
    </nav>
    <main class="view" id="view"></main>
  </div>
  <script type="module" src="/js/kasir.js"></script>
</body>
</html>
