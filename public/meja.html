<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3b2418">
  <title>Pesan dari Meja</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; height: calc(100dvh - 64px); }
    .menu-pane { overflow: auto; padding: 14px 16px 120px; }
    .cats { position: sticky; top: -14px; z-index: 5; background: var(--bg); padding: 10px 0 12px; margin-top: -14px; }
    .cat-title { margin: 18px 0 10px; font-size: 18px; display: flex; gap: 8px; align-items: center; }
    .cart-pane { border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
    .cart-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
    .cart-items { flex: 1; overflow: auto; padding: 8px 16px; }
    .cart-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
    .cart-item .nm { font-weight: 700; }
    .cart-foot { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
    .tot { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink-2); }
    .tot.big { font-size: 20px; font-weight: 800; color: var(--ink); }
    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .seg button { min-height: 42px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; }
    .seg button.on { border-color: var(--gold); background: var(--gold-soft); }
    .cart-bar { display: none; }
    .search { max-width: 260px; }
    .order-card { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .order-card .q { font-size: 28px; font-weight: 900; color: var(--brand-2); }
    .ready-alert { position: fixed; inset: 0; z-index: 250; background: rgba(20,12,8,.8); display: grid; place-items: center; padding: 20px; animation: fade .2s; }
    .ready-alert .box { background: var(--ok); color: #fff; border-radius: 28px; padding: 32px; text-align: center; max-width: 520px; width: 100%; box-shadow: var(--shadow-lg); }
    .ready-alert .no { font-size: 84px; font-weight: 900; line-height: 1; margin: 10px 0; }
    .steps { display: flex; gap: 6px; }
    .steps i { flex: 1; height: 6px; border-radius: 6px; background: var(--line); }
    .steps i.on { background: var(--gold); }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .cart-pane { position: fixed; inset: auto 0 0 0; top: 10dvh; z-index: 60; border-radius: 22px 22px 0 0; box-shadow: var(--shadow-lg); transform: translateY(105%); transition: transform .25s; }
      .cart-pane.open { transform: none; }
      .cart-bar { display: flex; position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 50; }
      .search { display: none; }
    }
    @media (max-width: 560px) {
      .topbar { gap: 8px; padding-left: 12px; padding-right: 12px; }
      .topbar .lbl { display: none; }
      .topbar .btn { padding: 8px 12px; }
      .brand { font-size: 15px; min-width: 0; }
      .brand > div { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span id="logo"></span><div><span id="store">Five5Star Coffee</span><small id="table-name">Memuat…</small></div></div>
    <div class="spacer"></div>
    <input class="input search" id="search" placeholder="🔍 Cari menu…" style="background:rgba(255,255,255,.12);border-color:transparent;color:inherit">
    <button class="btn" id="btn-waiter">🙋<span class="lbl"> Panggil Pelayan</span></button>
    <button class="btn gold" id="btn-orders">🧾<span class="lbl"> Pesanan</span> <span id="orders-count"></span></button>
    <span class="conn" id="conn"></span>
  </header>

  <div class="layout" id="layout">
    <section class="menu-pane" id="menu-pane">
      <div class="cats"><div class="tabs" id="cats"></div></div>
      <div id="menu"></div>
    </section>
    <aside class="cart-pane" id="cart">
      <div class="cart-head"><h3 class="grow">Keranjang</h3><button class="btn ghost sm" id="cart-clear">Kosongkan</button><button class="btn ghost icon-btn" id="cart-close" aria-label="Tutup">✕</button></div>
      <div class="cart-items" id="cart-items"></div>
      <div class="cart-foot">
        <div class="seg" id="otype"><button data-v="dine_in" class="on">🍽️ Makan di sini</button><button data-v="takeaway">🛍️ Bawa pulang</button></div>
        <input class="input" id="cust-name" maxlength="40" placeholder="Nama Anda (untuk dipanggil)">
        <input class="input" id="order-note" maxlength="300" placeholder="Catatan pesanan (opsional)">
        <div id="totals"></div>
        <button class="btn gold lg block" id="btn-submit" disabled>Pesan Sekarang</button>
      </div>
    </aside>
  </div>
  <button class="btn primary lg cart-bar" id="cart-bar"><span class="grow" style="text-align:left" id="cart-bar-text">Keranjang kosong</span><span id="cart-bar-total"></span></button>

  <script type="module" src="/js/meja.js"></script>
</body>
</html>
